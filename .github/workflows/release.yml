name: Release

# Triggered by the tag that `npm run release` creates and pushes. Everything
# that used to be manual — or used to fail — happens here:
#
#   • npm publish, which `.release-it.json` has always had switched off and which
#     therefore had to be remembered by hand every time
#   • the GitHub release, which failed locally because there was no token.
#     Inside Actions, GITHUB_TOKEN is provided automatically.
#
# Publishing to npm also feeds the CDN: jsDelivr serves
# cdn.jsdelivr.net/npm/@bloomscorp/bloomsight.js@<version>/umd/production.js
# from the published tarball, so one publish updates both channels.
on:
  push:
    tags: ['v*']

permissions:
  contents: write      # create the GitHub release
  id-token: write      # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the changelog needs history

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - run: npm ci

      # The same gates as CI. A tag should never publish something that does not
      # typecheck, test and build.
      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build (npm artefacts)
        run: npm run build

      - name: Bundle (CDN artefacts)
        run: npm run bundle

      # The tag and package.json must agree, or npm and the CDN end up serving a
      # version the git history does not describe.
      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG"
            exit 1
          fi

      - name: Verify the tarball contains both dist/ and umd/
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map(f => f.path);
            const need = ['dist/index.js', 'dist/index.mjs', 'dist/index.d.ts', 'umd/production.js', 'umd/dom.js'];
            const missing = need.filter(f => !files.includes(f));
            if (missing.length) {
              console.error('missing from the published tarball:', missing);
              process.exit(1);
            }
            console.log('tarball contains all ' + need.length + ' required artefacts');
          "

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Published to npm as \`@bloomscorp/bloomsight.js@${GITHUB_REF_NAME#v}\`.

          CDN:
          \`\`\`html
          <script src=\"https://cdn.jsdelivr.net/npm/@bloomscorp/bloomsight.js@${GITHUB_REF_NAME#v}/umd/production.js\"></script>
          <script src=\"https://cdn.jsdelivr.net/npm/@bloomscorp/bloomsight.js@${GITHUB_REF_NAME#v}/umd/dom.js\"></script>
          \`\`\`

          See CHANGELOG.md for what changed."

      - name: Summary
        run: |
          V="${GITHUB_REF_NAME#v}"
          {
            echo "### Published \`@bloomscorp/bloomsight.js@$V\`"
            echo
            echo "- npm: https://www.npmjs.com/package/@bloomscorp/bloomsight.js/v/$V"
            echo "- CDN: https://cdn.jsdelivr.net/npm/@bloomscorp/bloomsight.js@$V/umd/production.js"
            echo
            echo "jsDelivr caches on first request, so the CDN URL may take a moment to warm up."
          } >> "$GITHUB_STEP_SUMMARY"
